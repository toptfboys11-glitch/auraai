<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReplyPro AI — Generate Reply</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#fff;--bg2:#f9f9fb;--bg3:#f3f4f6;--ink:#111827;--ink2:#374151;--muted:#6b7280;--blue:#2563eb;--blue2:#1d4ed8;--green:#16a34a;--border:#e5e7eb;--border2:#d1d5db;--wa-bg:#e5ddd5;--wa-bubble:#dcf8c6;--wa-dark:#128c7e;}
body{background:var(--bg2);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;}
a{text-decoration:none;color:inherit;}
nav{background:rgba(255,255,255,0.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 1.5rem;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-size:16px;font-weight:700;letter-spacing:-0.3px;display:flex;align-items:center;gap:8px;}
.logo-icon{width:28px;height:28px;background:var(--blue);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;}
.nav-user{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
.upgrade-btn{background:var(--blue);color:#fff;border:none;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.layout{max-width:1100px;margin:0 auto;padding:2rem 1.5rem;display:grid;grid-template-columns:360px 1fr;gap:1.5rem;align-items:start;}
.input-panel{background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;position:sticky;top:70px;}
.panel-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);}
.panel-title{font-size:15px;font-weight:600;margin-bottom:2px;}
.panel-sub{font-size:12px;color:var(--muted);}
.panel-body{padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:1rem;}
.field-label{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px;display:block;}
textarea{width:100%;border:1px solid var(--border2);border-radius:9px;padding:10px 12px;font-size:13px;font-family:inherit;color:var(--ink);background:var(--bg2);resize:none;outline:none;transition:border 0.15s;line-height:1.65;}
textarea:focus{border-color:var(--blue);background:var(--bg);}
textarea::placeholder{color:#aaa;}
select{width:100%;border:1px solid var(--border2);border-radius:9px;padding:9px 12px;font-size:13px;font-family:inherit;color:var(--ink);background:var(--bg2);outline:none;cursor:pointer;}
select:focus{border-color:var(--blue);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--border2);background:var(--bg2);font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);transition:all 0.15s;font-family:inherit;}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.gen-btn{width:100%;background:var(--blue);color:#fff;border:none;padding:13px;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;}
.gen-btn:hover{background:var(--blue2);}
.gen-btn:disabled{opacity:0.55;cursor:not-allowed;}
.usage-wrap{padding-top:0.75rem;border-top:1px solid var(--border);}
.usage-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px;}
.usage-track{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.usage-fill{height:100%;background:var(--blue);border-radius:2px;transition:width 0.4s;}
.usage-hint{font-size:11px;color:var(--muted);margin-top:5px;}
.empty-state{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:4rem 2rem;text-align:center;}
.empty-icon{font-size:44px;color:#d1d5db;margin-bottom:1rem;}
.empty-title{font-size:17px;font-weight:600;margin-bottom:6px;}
.empty-sub{font-size:14px;color:var(--muted);}
.wa-preview-box{background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:1rem;}
.wa-hdr{background:var(--wa-dark);padding:12px 16px;display:flex;align-items:center;gap:10px;}
.wa-hdr-av{width:32px;height:32px;border-radius:50%;background:#5bc8af;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}
.wa-hdr-name{font-size:13px;font-weight:600;color:#fff;}
.wa-hdr-sub{font-size:11px;color:rgba(255,255,255,0.6);}
.wa-body{background:var(--wa-bg);padding:14px;display:flex;flex-direction:column;gap:6px;}
.wa-recv{background:#fff;border-radius:0 8px 8px 8px;padding:8px 12px;max-width:85%;font-size:13px;line-height:1.65;box-shadow:0 1px 2px rgba(0,0,0,0.08);}
.wa-time{font-size:10px;color:var(--muted);padding-left:2px;}
.reply-cards{display:flex;flex-direction:column;gap:1rem;}
.rcard{background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.rcard-hdr{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2);}
.rbadge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;display:flex;align-items:center;gap:5px;}
.rb-pro{color:var(--blue);}
.rb-close{color:var(--green);}
.rb-nego{color:#d97706;}
.copy-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border2);background:var(--bg);font-size:12px;font-weight:500;cursor:pointer;color:var(--ink2);font-family:inherit;display:flex;align-items:center;gap:4px;}
.copy-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
.copy-btn.copied{background:#dcfce7;color:var(--green);border-color:#86efac;}
.rcard-body{padding:16px;}
.rtext{font-size:14px;color:var(--ink2);line-height:1.8;white-space:pre-wrap;}
.wa-bubble{background:var(--wa-bubble);border-radius:8px 0 8px 8px;padding:10px 14px;margin:0 16px 16px;font-size:13px;line-height:1.7;color:var(--ink);}
.wa-bubble-time{font-size:10px;color:var(--muted);text-align:right;margin-top:4px;}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{animation:spin 0.8s linear infinite;display:inline-block;}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
@media(max-width:768px){.layout{grid-template-columns:1fr;}.input-panel{position:static;}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">
    <div class="logo-icon"><i class="ti ti-message-bolt" style="font-size:14px;"></i></div>
    Reply<span style="color:var(--blue);">Pro</span> AI
  </a>
  <div class="nav-user">
    <span id="user-name">Guest</span>
    <button class="upgrade-btn" onclick="location.href='pricing.html'">Upgrade</button>
  </div>
</nav>

<div class="layout">
  <div class="input-panel">
    <div class="panel-header">
      <div class="panel-title">Generate AI Reply</div>
      <div class="panel-sub">Paste message → Get 3 replies in 10 seconds</div>
    </div>
    <div class="panel-body">
      <div>
        <label class="field-label">Quick scenario</label>
        <div class="chips">
          <button class="chip active" onclick="setChip(this,'price')">💰 Price pressure</button>
          <button class="chip" onclick="setChip(this,'complaint')">😤 Complaint</button>
          <button class="chip" onclick="setChip(this,'negotiate')">🤝 Negotiation</button>
          <button class="chip" onclick="setChip(this,'followup')">📬 Follow-up</button>
          <button class="chip" onclick="setChip(this,'inquiry')">🆕 New inquiry</button>
        </div>
      </div>
      <div>
        <label class="field-label">Customer message</label>
        <textarea id="customer-msg" rows="6" placeholder="Paste your customer's WhatsApp or email message here...">Hi, your price is too high. We found another supplier offering 20% cheaper. Can you match their price? We want to place 1,000 units if the price is right.</textarea>
      </div>
      <div>
        <label class="field-label">Your industry</label>
        <select id="industry">
          <option>General export / trading</option>
          <option>Textile and apparel</option>
          <option>Electronics and tech</option>
          <option>Machinery and equipment</option>
          <option>Food and agriculture</option>
          <option>Furniture and home goods</option>
          <option>Chemicals and materials</option>
          <option>Automotive parts</option>
        </select>
      </div>
      <div>
        <label class="field-label">Reply channel</label>
        <select id="channel">
          <option>WhatsApp</option>
          <option>Email</option>
        </select>
      </div>
      <button class="gen-btn" id="gen-btn" onclick="generate()">
        <i class="ti ti-sparkles"></i> Generate 3 replies
      </button>
      <div class="usage-wrap">
        <div class="usage-row">
          <span>Daily usage</span>
          <span id="usage-text">0 / 10 free replies used</span>
        </div>
        <div class="usage-track"><div class="usage-fill" id="usage-fill" style="width:0%"></div></div>
        <div class="usage-hint">Upgrade to Pro for unlimited replies</div>
      </div>
    </div>
  </div>

  <div id="output-area">
    <div class="empty-state">
      <div class="empty-icon"><i class="ti ti-message-dots"></i></div>
      <div class="empty-title">Your replies will appear here</div>
      <div class="empty-sub">Fill in the customer message and click Generate</div>
    </div>
  </div>
</div>

<div class="toast" id="toast">Copied!</div>

<script>
// ── CONFIG ──────────────────────────────────────────
const GEMINI_KEY = 'AIzaSyBKhAFgwHr_2kBQwWVvLyyuJ_0BeAEltdc';
const GEMINI_URL = 'https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent?key=' + GEMINI_KEY;
// ────────────────────────────────────────────────────

const presets = {
  price: "Hi, your price is too high. We found another supplier offering 20% cheaper. Can you match their price? We want to place 1,000 units if the price is right.",
  complaint: "We received the shipment but the quality is not what we expected. Some items are damaged and colors are different from samples. This is a serious issue.",
  negotiate: "We are interested but the MOQ is too high for us. Can you lower it to 200 units for the first order? We are a small company but we plan to grow.",
  followup: "Hi, I sent you a message 5 days ago about pricing and MOQ but have not heard back. Are you still interested in working with us?",
  inquiry: "Hello, we found your company online. We are looking for a reliable supplier for import. Can you send us your catalog, MOQ and payment terms?"
};

function setChip(btn, type) {
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('customer-msg').value = presets[type];
}

var usageCount = 0;

function generate() {
  var msg = document.getElementById('customer-msg').value.trim();
  var industry = document.getElementById('industry').value;
  var channel = document.getElementById('channel').value;
  if (!msg) { document.getElementById('customer-msg').focus(); return; }

  var btn = document.getElementById('gen-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader spin"></i> Generating...';
  document.getElementById('output-area').innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="ti ti-loader spin" style="font-size:36px;color:var(--blue);"></i></div><div class="empty-title">Writing your replies...</div><div class="empty-sub">About 10 seconds</div></div>';

  var prompt = 'You are a senior export sales manager with 10+ years experience in ' + industry + '.\n\nCustomer ' + channel + ' message: "' + msg + '"\n\nWrite 3 different replies. Rules:\n- Natural human tone, NOT robotic\n- 3 to 5 sentences each\n- No cliches\n- Sound like a real salesperson\n\nUse EXACTLY this format:\n\n[PROFESSIONAL]\nReply 1 here.\n\n[CLOSING]\nReply 2 here.\n\n[NEGOTIATION]\nReply 3 here.';

  fetch('/api/reply', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ msg: msg, industry: industry, channel: channel })
  })
  .then(function(res){ return res.json(); })
  .then(function(data) {
    if (data.error) throw new Error(data.error);
    var raw = data.text || '';
    console.log('Got response, length:', raw.length);

    function extract(label) {
      var idx = raw.toUpperCase().indexOf('[' + label + ']');
      if (idx === -1) return '';
      var after = raw.slice(idx + label.length + 2).trim();
      var next = after.search(/\[(?:PROFESSIONAL|CLOSING|NEGOTIATION)\]/i);
      return (next === -1 ? after : after.slice(0, next)).trim();
    }

    var proText = extract('PROFESSIONAL');
    var closeText = extract('CLOSING');
    var negoText = extract('NEGOTIATION');

    var now = new Date();
    var t = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');

    var out = document.getElementById('output-area');
    out.innerHTML = '';

    // WhatsApp message preview
    var waBox = document.createElement('div');
    waBox.className = 'wa-preview-box';
    var waHdr = document.createElement('div');
    waHdr.className = 'wa-hdr';
    waHdr.innerHTML = '<div class="wa-hdr-av">C</div><div><div class="wa-hdr-name">Customer message</div><div class="wa-hdr-sub">' + channel + ' · ' + industry + '</div></div>';
    var waBody = document.createElement('div');
    waBody.className = 'wa-body';
    var waMsg = document.createElement('div');
    waMsg.className = 'wa-recv';
    waMsg.textContent = msg;
    var waTime = document.createElement('div');
    waTime.className = 'wa-time';
    waTime.textContent = t;
    waBody.appendChild(waMsg);
    waBody.appendChild(waTime);
    waBox.appendChild(waHdr);
    waBox.appendChild(waBody);
    out.appendChild(waBox);

    // Reply cards
    var cards = document.createElement('div');
    cards.className = 'reply-cards';

    var replies = [
      { label: 'Professional Reply', cls: 'rb-pro', icon: 'ti-briefcase', text: proText },
      { label: 'Closing-Oriented Reply', cls: 'rb-close', icon: 'ti-target', text: closeText },
      { label: 'Soft Negotiation Reply', cls: 'rb-nego', icon: 'ti-handshake', text: negoText }
    ];

    replies.forEach(function(r) {
      var card = document.createElement('div');
      card.className = 'rcard';

      var hdr = document.createElement('div');
      hdr.className = 'rcard-hdr';

      var badge = document.createElement('div');
      badge.className = 'rbadge ' + r.cls;
      badge.innerHTML = '<i class="ti ' + r.icon + '" style="font-size:12px;"></i> ' + r.label;

      var copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.innerHTML = '<i class="ti ti-copy" style="font-size:13px;"></i> Copy';
      var rtext = r.text;
      copyBtn.onclick = function() {
        navigator.clipboard.writeText(rtext);
        var toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(function(){ toast.classList.remove('show'); }, 2000);
        copyBtn.classList.add('copied');
        copyBtn.innerHTML = '<i class="ti ti-check" style="font-size:13px;"></i> Copied!';
        setTimeout(function(){
          copyBtn.classList.remove('copied');
          copyBtn.innerHTML = '<i class="ti ti-copy" style="font-size:13px;"></i> Copy';
        }, 2500);
      };

      hdr.appendChild(badge);
      hdr.appendChild(copyBtn);

      var body = document.createElement('div');
      body.className = 'rcard-body';
      var rtextEl = document.createElement('div');
      rtextEl.className = 'rtext';
      rtextEl.textContent = rtext;
      body.appendChild(rtextEl);

      var bubble = document.createElement('div');
      bubble.className = 'wa-bubble';
      bubble.textContent = rtext;
      var bubbleTime = document.createElement('div');
      bubbleTime.className = 'wa-bubble-time';
      bubbleTime.textContent = t + ' ✓✓';
      bubble.appendChild(bubbleTime);

      card.appendChild(hdr);
      card.appendChild(body);
      card.appendChild(bubble);
      cards.appendChild(card);
    });

    out.appendChild(cards);

    usageCount++;
    var pct = Math.min((usageCount / 10) * 100, 100);
    document.getElementById('usage-text').textContent = usageCount + ' / 10 free replies used';
    document.getElementById('usage-fill').style.width = pct + '%';

    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-sparkles"></i> Generate 3 replies';
  })
  .catch(function(e) {
    console.error('Error:', e);
    document.getElementById('output-area').innerHTML = '<div class="empty-state"><div class="empty-title">Error: ' + e.message + '</div><div class="empty-sub">Please try again.</div></div>';
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-sparkles"></i> Generate 3 replies';
  });
}
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
const sb = createClient('https://svuhyxxsfgujosmxejyy.supabase.co','sb_publishable_pJMBD68Lm3caEZqI02cg4A_cNbrFu5q');
sb.auth.getSession().then(function(r){
  var session = r.data.session;
  if(session){
    var name = (session.user.user_metadata && session.user.user_metadata.full_name) ? session.user.user_metadata.full_name : session.user.email.split('@')[0];
    document.getElementById('user-name').textContent = 'Hi, ' + name;
  }
});
</script>
</body>
</html>
